<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="threeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#051726" />
    </linearGradient>
    <radialGradient id="tealGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <pattern id="wireGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.1" />
    </pattern>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#threeBg)" />
  <rect width="1200" height="630" fill="url(#tealGlow)" />
  <rect width="1200" height="630" fill="url(#wireGrid)" />

  <!-- Outer Framing -->
  <rect x="28" y="28" width="1144" height="574" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left: Official Three.js Geometric Icon & Lockup -->
  <g transform="translate(100, 130)">
    <!-- Icon Container Box -->
    <rect x="0" y="0" width="105" height="105" rx="20" fill="#0f172a" stroke="#14b8a6" stroke-width="2" />
    <!-- Three.js Geometric Triangles -->
    <g transform="translate(15, 15) scale(0.33)" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linejoin="round">
      <path d="m63.02 200.61-43.213-174.94 173.23 49.874z" fill="#042f2e" />
      <path d="m106.39 50.612 21.591 87.496-86.567-24.945z" fill="#115e59" />
      <path d="m84.91 125.03-10.724-43.465 43.008 12.346z" fill="#14b8a6" />
      <path d="m63.458 38.153 10.724 43.465-43.008-12.346z" fill="#0d9488" />
      <path d="m149.47 62.93 10.724 43.465-43.008-12.346z" fill="#0f766e" />
      <path d="m84.915 125.06 10.724 43.465-43.008-12.346z" fill="#134e4a" />
    </g>

    <!-- Title Lockup -->
    <text x="135" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">three.js</text>
    <text x="135" y="85" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#2dd4bf">JAVASCRIPT 3D WEBGL ENGINE &amp; REAL-TIME GRAPHICS</text>
  </g>

  <!-- Value Proposition -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">
    In-Browser 3D Movement, PointerLock Controls &amp; Physics
  </text>
  <text x="100" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8">
    Hardware-accelerated 60fps WebGL rendering loop, dynamic camera projection, and 6-axis keyboard state polling.
  </text>

  <!-- Badges -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="190" height="42" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#2dd4bf" />
    <text x="38" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ccfbf1">Three.js / WebGL</text>

    <rect x="206" y="0" width="220" height="42" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
    <circle cx="230" cy="21" r="5" fill="#2dd4bf" />
    <text x="244" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ccfbf1">PointerLock Controls</text>

    <rect x="442" y="0" width="200" height="42" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
    <circle cx="466" cy="21" r="5" fill="#2dd4bf" />
    <text x="480" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ccfbf1">WASD Flight Mode</text>

    <rect x="658" y="0" width="210" height="42" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
    <circle cx="682" cy="21" r="5" fill="#2dd4bf" />
    <text x="696" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ccfbf1">60 FPS Render Loop</text>
  </g>

  <!-- Right: 3D Wireframe Icosahedron Illustration -->
  <g transform="translate(930, 240)" stroke="#2dd4bf" stroke-width="1.8" fill="none" opacity="0.85">
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" stroke="#14b8a6" fill="#0f766e" fill-opacity="0.1" />
    <polygon points="0,-90 0,90 78,-45" stroke="#0ea5e9" />
    <polygon points="0,-90 0,90 -78,-45" stroke="#06b6d4" />
    <line x1="-78" y1="45" x2="78" y2="-45" stroke="#2dd4bf" />
    <line x1="-78" y1="-45" x2="78" y2="45" stroke="#2dd4bf" />
    <circle cx="0" cy="0" r="6" fill="#5eead4" />
  </g>

  <text x="100" y="540" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#2dd4bf">threejs.org &#8226; Interactive WebGL Simulation</text>
</svg>

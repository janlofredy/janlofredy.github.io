<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="chrmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061c14" />
      <stop offset="50%" stop-color="#030e0a" />
      <stop offset="100%" stop-color="#082b1e" />
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <pattern id="chrmsGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#chrmsBg)" />
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />
  <rect width="1200" height="630" fill="url(#chrmsGrid)" />

  <rect x="28" y="28" width="1144" height="574" rx="16" fill="none" stroke="#059669" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Brand Identity -->
  <g transform="translate(100, 140)">
    <!-- Municipal Emblem / Building Symbol -->
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#059669" />
    <!-- Classical Municipal Columns -->
    <path d="M 25 35 L 75 35 L 50 20 Z M 28 40 L 34 75 M 42 40 L 48 75 M 54 40 L 60 75 M 68 40 L 74 75 M 22 75 L 78 75 L 78 82 L 22 82 Z" stroke="#ffffff" stroke-width="3" fill="#ffffff" />

    <text x="130" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">CHRMS Butuan</text>
    <text x="130" y="82" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#34d399">CITY HUMAN RESOURCE MANAGEMENT SYSTEM &#8226; LGU BUTUAN</text>
  </g>

  <!-- Value Proposition -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">
    Municipal Enterprise Workforce &amp; Civil Service Records System
  </text>
  <text x="100" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8">
    Granular role-based access control (RBAC), multi-tier audit logging, and automated leave credit computation.
  </text>

  <!-- Badges -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="170" height="42" rx="8" fill="#0a2a1f" stroke="#059669" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#34d399" />
    <text x="38" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#a7f3d0">PHP &amp; MySQL</text>

    <rect x="186" y="0" width="220" height="42" rx="8" fill="#0a2a1f" stroke="#059669" stroke-width="1" />
    <circle cx="210" cy="21" r="5" fill="#34d399" />
    <text x="224" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#a7f3d0">Granular RBAC Security</text>

    <rect x="422" y="0" width="220" height="42" rx="8" fill="#0a2a1f" stroke="#059669" stroke-width="1" />
    <circle cx="446" cy="21" r="5" fill="#34d399" />
    <text x="460" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#a7f3d0">Automated Audit Trails</text>

    <rect x="658" y="0" width="210" height="42" rx="8" fill="#0a2a1f" stroke="#059669" stroke-width="1" />
    <circle cx="682" cy="21" r="5" fill="#34d399" />
    <text x="696" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#a7f3d0">Government Intranet</text>
  </g>

  <text x="100" y="540" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#34d399">chrms.butuan.gov.ph &#8226; Municipal Infrastructure</text>
</svg>

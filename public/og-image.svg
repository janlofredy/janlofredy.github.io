    <rect x="0" y="0" width="235" height="85" rx="10" fill="#0b0f19" stroke="#1f2937" stroke-width="1" />
    <text x="24" y="38" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#f8fafc">6+ Years</text>
    <text x="24" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" letter-spacing="1">EXPERIENCE</text>

    <!-- Metric 2 -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#1f2937" stroke-width="2" />

  <!-- Terminal Header Bar -->
  <rect x="24" y="24" width="1152" height="56" rx="16" fill="#0b0f19" />
  <rect x="24" y="64" width="1152" height="16" fill="#0b0f19" />
  <line x1="24" y1="80" x2="1176" y2="80" stroke="#1f2937" stroke-width="2" />
  
  <!-- Terminal Dots -->
  <circle cx="60" cy="52" r="6" fill="#ef4444" />
  <circle cx="80" cy="52" r="6" fill="#f59e0b" />
  <circle cx="100" cy="52" r="6" fill="#10b981" />
  <text x="130" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" fill="#64748b">janlofre.com &#8226; engineering dossier</text>

  <!-- Status Pill -->
  <rect x="880" y="40" width="260" height="26" rx="13" fill="#111827" stroke="#1f2937" stroke-width="1" />
  <circle cx="900" cy="53" r="4" fill="#10b981" />
  <text x="915" y="57" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">FULL STACK &amp; BACKEND DEV</text>

  <!-- Main Content Box -->
  <!-- Monogram Box -->
  <rect x="80" y="140" width="90" height="90" rx="16" fill="#111827" stroke="#14b8a6" stroke-width="2" />
  <text x="125" y="200" font-family="'JetBrains Mono', monospace" font-size="44" font-weight="900" fill="#14b8a6" text-anchor="middle">JD</text>

  <!-- Name & Headline -->
  <text x="195" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="-1">Jose Janlofre Dy</text>
  <text x="195" y="215" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="url(#tealGrad)">Software Developer | Application Architect | Bug Hunter</text>

  <!-- Elevator Description -->
  <text x="80" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#94a3b8">
    Specialized in custom enterprise platforms, scalable REST APIs, relational database architecture,
  </text>
  <text x="80" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#94a3b8">
    on-premise local machine deployments with Laravel &amp; CodeIgniter, and real-time 3D WebGL.
  </text>

  <!-- Metrics Row -->
  <g transform="translate(80, 380)">

    <text x="279" y="38" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#f8fafc">15+ Delivered</text>
    <text x="279" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" letter-spacing="1">CLIENT PLATFORMS</text>

    <!-- Metric 3 -->
    <rect x="520" y="0" width="245" height="85" rx="10" fill="#0b0f19" stroke="#1f2937" stroke-width="1" />
    <text x="544" y="38" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#14b8a6">1st Place</text>
    <text x="544" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" letter-spacing="1">2018 ICT CHAMPION</text>

    <!-- Metric 4 -->
    <rect x="785" y="0" width="255" height="85" rx="10" fill="#0b0f19" stroke="#1f2937" stroke-width="1" />
    <text x="809" y="38" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#f8fafc">100%</text>
    <text x="809" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" letter-spacing="1">ENGINEERING DEPTH</text>
  </g>


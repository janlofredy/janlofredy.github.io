    <text x="47" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">Laravel</text>

    <rect x="107" y="0" width="125" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="169" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">CodeIgniter</text>

    <rect x="244" y="0" width="90" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="289" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">Nuxt 3</text>

    <rect x="346" y="0" width="85" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="388" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">Vue 3</text>

    <rect x="443" y="0" width="120" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="503" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">Three.js 3D</text>

    <rect x="575" y="0" width="90" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="620" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">Docker</text>

    <rect x="677" y="0" width="85" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="719" y="21" font-family="'JetBrains Mono', monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">MySQL</text>

    <text x="1040" y="22" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#14b8a6" text-anchor="end">https://janlofre.com</text>
